name: SpiralCore installed SDK validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    if: startsWith(github.ref, 'refs/heads/ci/spiralcore-installed-sdk-')
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test portable bundle preparation and SDK dispatch
        run: |
          set -euo pipefail
          git rev-parse HEAD
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 test --locked -p mvm-client --lib launch::bundle_runtime::tests
